name: Backend Tests

# Har bir push va pull request'da (main branch'ga) avtomatik ishga tushadi.
# Nega bu muhim: endi "pytest -v ishga tushirishni unutib qoldim" degan
# holat bo'lmaydi — GitHub buni SIZ uchun, har safar, avtomatik qiladi.
# Agar biror test qizil (FAILED) chiqsa, GitHub'da qizil belgi ko'rinadi
# va (agar yoqilgan bo'lsa) email orqali xabar keladi.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python 3.12 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Testlarni ishga tushirish
        run: pytest -v
